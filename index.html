<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光谷房产信息 · 小区二手房/租房</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1a1a1a;line-height:1.6}
header{background:linear-gradient(135deg,#1a56db,#0e3a9e);color:#fff;padding:2rem 1.2rem 1.4rem;text-align:center}
header h1{font-size:1.5rem;margin-bottom:.3rem}
header p{opacity:.85;font-size:.85rem}
.tabs{display:flex;gap:.6rem;justify-content:center;margin-top:1.1rem;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:.45rem 1.3rem;font-size:.9rem;cursor:pointer}
.tab.active{background:#fff;color:#1a56db;font-weight:700}
.stats{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:1.1rem}
.stat{background:rgba(255,255,255,.15);border-radius:10px;padding:.7rem 1.2rem;min-width:110px}
.stat b{display:block;font-size:1.25rem}
.stat span{font-size:.78rem;opacity:.85}
main{max-width:960px;margin:0 auto;padding:1.2rem}
section{background:#fff;border-radius:12px;padding:1.2rem;margin-bottom:1.2rem;box-shadow:0 1px 4px rgba(0,0,0,.06)}
h2{font-size:1.15rem;margin-bottom:.8rem;border-left:4px solid #1a56db;padding-left:.6rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:.55rem .4rem;border-bottom:1px solid #eee;text-align:left}
th{background:#f8f9fb;font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:none}
.price{color:#e11d48;font-weight:700;white-space:nowrap}
.note{font-size:.8rem;color:#666;background:#fff8e1;border-radius:8px;padding:.7rem .9rem;margin-bottom:1.2rem}
footer{text-align:center;font-size:.78rem;color:#999;padding:1.5rem 1rem}
.badge{display:inline-block;background:#eef4ff;color:#1a56db;border-radius:20px;padding:.15rem .7rem;font-size:.75rem;margin-right:.4rem}
@media(max-width:640px){table{font-size:.78rem}th,td{padding:.45rem .25rem}}
</style>
</head>
<body>
<header>
<h1>光谷房产信息</h1>
<p>武汉 · 东湖高新区 · 小区二手房 / 出租公开信息聚合</p>
<div class="tabs" id="tabs"></div>
<div class="stats" id="stats"></div>
</header>
<main>
<div class="note" id="disclaimer"></div>
<section><h2>小区概况</h2><p id="profile" style="font-size:.9rem;color:#333"></p></section>
<section><h2>在售二手房 <span class="badge" id="saleCount"></span></h2>
<table><thead><tr><th>户型</th><th>面积</th><th>总价</th><th>单价</th><th>朝向</th><th>备注</th></tr></thead><tbody id="saleList"></tbody></table></section>
<section id="dealSection"><h2>近期成交</h2>
<table><thead><tr><th>面积</th><th>成交价</th><th>单价</th><th>成交日期</th></tr></thead><tbody id="dealList"></tbody></table></section>
<section><h2>出租房源 <span class="badge" id="rentCount"></span></h2>
<table><thead><tr><th>户型</th><th>面积</th><th>月租金</th><th>备注</th></tr></thead><tbody id="rentList"></tbody></table></section>

<section><h2>想查的小区</h2>
<p style="font-size:.85rem;color:#555;margin-bottom:.8rem">没找到你想查的小区？留个言，站长看到后会去采集上架。</p>
<form id="msgForm" style="display:flex;flex-direction:column;gap:.7rem">
<input id="fName" placeholder="小区名称（必填），如：保利时代" style="padding:.6rem;border:1px solid #ddd;border-radius:8px;font-size:.9rem" required>
<input id="fArea" placeholder="大概位置（选填），如：光谷天地附近" style="padding:.6rem;border:1px solid #ddd;border-radius:8px;font-size:.9rem">
<input id="fContact" placeholder="联系方式（选填，微信/手机）" style="padding:.6rem;border:1px solid #ddd;border-radius:8px;font-size:.9rem">
<button type="submit" style="background:#1a56db;color:#fff;border:none;border-radius:8px;padding:.7rem;font-size:.95rem;cursor:pointer">提交留言</button>
<p id="msgTip" style="font-size:.85rem"></p>
</form>
<script>
document.getElementById('msgForm').addEventListener('submit',async e=>{
e.preventDefault();
const tip=document.getElementById('msgTip');
tip.style.color='#666';tip.textContent='提交中…';
try{
const r=await fetch('/api/message',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({name:document.getElementById('fName').value.trim(),area:document.getElementById('fArea').value.trim(),contact:document.getElementById('fContact').value.trim()})});
const j=await r.json();
if(j.ok){tip.style.color='#16a34a';tip.textContent='已收到，站长会尽快处理！';e.target.reset();}
else{tip.style.color='#e11d48';tip.textContent=j.error||'提交失败，请重试';}
}catch(err){tip.style.color='#e11d48';tip.textContent='网络错误，请重试';}
});
</script>
</section>
<section><h2>数据来源</h2><p id="sources" style="font-size:.85rem;color:#555"></p></section>
</main>
<footer>光谷房产信息 · guanggu.aipricegood.com · <span id="updateDate"></span>更新</footer>
<script>
const COMMUNITIES=[
{name:"新世界恒大华府",file:"data-hengdahuafu.json"},
{name:"蓝光·武汉COCO时代",file:"data-languang.json"}
];
let current=0;
function renderTabs(){
document.getElementById('tabs').innerHTML=COMMUNITIES.map((c,i)=>
`<button class="tab${i===current?' active':''}" onclick="switchTo(${i})">${c.name}</button>`).join('');
}
function switchTo(i){current=i;load();}
function esc(s){return (s==null?'':String(s));}
function load(){
renderTabs();
fetch(COMMUNITIES[current].file).then(r=>r.json()).then(d=>{
const avg=d.均价;
const avgText=typeof avg==='string'?avg:(avg.安居客10月挂牌均价||avg.安居客挂牌均价||'');
const saleN=d.在售.安居客在售套数||d.在售.在售套数||'';
const rentN=d.出租.安居客在租套数||'';
document.getElementById('stats').innerHTML=
`<div class="stat"><b>${esc(avgText)}</b><span>挂牌均价</span></div>
<div class="stat"><b>${esc(saleN)}${saleN?'套':''}</b><span>在售</span></div>
<div class="stat"><b>${esc(rentN)}${rentN?'套':''}</b><span>在租</span></div>`;
const xq=d.小区;
document.getElementById('profile').innerHTML=
`${esc(xq.地址)} · 建成${esc(xq.建成年份)}年 · ${esc(xq.规模||'')} ${esc(xq.主力面积段?'主力面积段'+xq.主力面积段:'')} · ${esc(xq.交通||'')}`;
document.getElementById('disclaimer').textContent=
'数据来自公开房源平台，采集于 '+d.采集日期+'，仅供参考，不构成购房建议。房源实时变动，请以平台最新信息为准。';
document.getElementById('saleCount').textContent=d.在售.在售套数?d.在售.在售套数:'';
document.getElementById('saleList').innerHTML=(d.在售.房源||[]).map(x=>
`<tr><td>${esc(x.户型)}</td><td>${esc(x.面积)}</td><td class="price">${esc(x.总价)}</td><td>${esc(x.单价)}</td><td>${esc(x.朝向)}</td><td>${esc(x.备注)||'-'}</td></tr>`).join('');
const deals=d.成交记录.记录||d.成交记录||[];
if(Array.isArray(deals)&&deals.length){
document.getElementById('dealSection').style.display='';
document.getElementById('dealList').innerHTML=deals.map(x=>
`<tr><td>${esc(x.面积)}</td><td class="price">${esc(x.成交总价)}</td><td>${esc(x.成交单价)}</td><td>${esc(x.成交日期)}</td></tr>`).join('');
}else{
document.getElementById('dealSection').style.display='none';
}
document.getElementById('rentCount').textContent=d.出租.在租套数?d.出租.在租套数:'';
document.getElementById('rentList').innerHTML=(d.出租.出租房源||d.出租.房源||[]).map(x=>
`<tr><td>${esc(x.户型)}</td><td>${esc(x.面积)}</td><td class="price">${esc(x.租金)}</td><td>${esc(x.备注||x.朝向||'')}${x.楼层?' · '+esc(x.楼层):''}</td></tr>`).join('');
const src=d.数据来源;
document.getElementById('sources').innerHTML=Object.entries(src).filter(([k])=>k!=='备注').map(([k,v])=>`${esc(k)}：${esc(v)}`).join('<br>')+(src.备注?'<br>'+esc(src.备注):'');
document.getElementById('updateDate').textContent=d.采集日期;
});
}
load();
</script>
</body>
</html>
